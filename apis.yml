aid: drahim-holdings
name: Drahim Holdings
description: >-
  Drahim (دراهم) is a Saudi personal-finance and automated-investment fintech, founded in Riyadh in
  2021 by Sultan Alkhayal and Yasser Alshurihi. Its mobile app uses open banking to aggregate a user's
  bank accounts into one view, enriches and auto-categorizes transactions (2.5B+ processed), and offers
  auto-savings, Zakat calculation, and Sharia-compliant robo-advisory portfolios spanning 40+ funds
  across Saudi and global equities, real estate, and commodities. Drahim is licensed by the Saudi Central
  Bank (SAMA) for open-banking/payment services and by the Capital Market Authority (CMA) for investment
  management; it was backed by Y Combinator and 500 Global, and Al Rajhi Bank acquired a 65% majority
  stake in 2024. Drahim is a consumer application and does not publish a public developer API, OpenAPI
  specification, or developer portal; this profile captures its corporate and product identity plus
  live domain-security posture. Consumer surfaces include the iOS and Android apps and a business platform.
